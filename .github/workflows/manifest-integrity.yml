name: Current pinned forensic Git blobs

on:
  push:
    branches: [main]
    paths:
      - "sana/**"
      - "phoenix/**"
      - "manifests/repo-v0.1-manifest.csv"
      - "manifests/current-tree-blobs.csv"
      - "scripts/verify_publication_manifest.py"
      - "tests/test_manifest_guard.py"
      - ".github/workflows/manifest-integrity.yml"
  pull_request:
    paths:
      - "sana/**"
      - "phoenix/**"
      - "manifests/repo-v0.1-manifest.csv"
      - "scripts/verify_publication_manifest.py"
      - "tests/test_manifest_guard.py"
      - ".github/workflows/manifest-integrity.yml"

permissions:
  contents: read

jobs:
  forensic-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current 52 Git blob identities (not legacy SHA256)
        run: python scripts/verify_publication_manifest.py
      - name: Test corrupted evidence and unsafe paths
        run: python -m unittest discover -s tests -v
